services:
  db:
    image: postgres:16-alpine
    container_name: gccc-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gccc
      POSTGRES_PASSWORD: gccc_dev_password
      POSTGRES_DB: gccc_ops
    ports:
      - "5432:5432"
    volumes:
      - gccc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gccc -d gccc_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gccc_pgdata:
